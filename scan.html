<style>
@font-face {
  font-family: 'Instrument Serif';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url("assets/fonts/asset-02.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Instrument Serif';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("assets/fonts/asset-04.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("assets/fonts/asset-17.woff") format('woff');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

:root {
  --bg: #000000;
  --fg: #efe9dc;
  --fg-2: #bdb6a7;
  --fg-dim: #7e7a71;
  --line: #1c1b19;
  --serif: 'Instrument Serif', 'Times New Roman', serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}

a { color: inherit; text-decoration: none; }

::selection { background: var(--fg); color: var(--bg); }

.page {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 48px 36px;
  max-width: 640px;
}

.stamp {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--fg-dim);
  padding-bottom: 48px;
  border-bottom: 1px solid var(--line);
}

.wordmark {
  padding-top: 64px;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(64px, 18vw, 140px);
  line-height: 0.88;
  letter-spacing: -0.03em;
  color: var(--fg);
  padding-bottom: 64px;
  border-bottom: 1px solid var(--line);
}

.wordmark em { font-style: italic; }

.identity {
  padding-top: 56px;
  padding-bottom: 56px;
  border-bottom: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.identity .name {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(28px, 7vw, 44px);
  line-height: 1.1;
  color: var(--fg-2);
}

.identity .role {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--fg-dim);
}

.tagline {
  padding-top: 56px;
  padding-bottom: 56px;
  border-bottom: 1px solid var(--line);
  font-family: var(--serif);
  font-size: clamp(22px, 5.5vw, 34px);
  line-height: 1.35;
  color: var(--fg-2);
}

.tagline em { font-style: italic; color: var(--fg); }

.cta {
  padding-top: 56px;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 40px;
}

.cta-label {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--fg-dim);
}

.email {
  display: block;
  font-family: var(--serif);
  font-size: clamp(20px, 5.5vw, 32px);
  line-height: 1.15;
  color: var(--fg);
  letter-spacing: -0.01em;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  transition: color .3s, border-color .3s;
}

.email:hover, .email:active { color: var(--fg-2); border-color: var(--fg-2); }

.colophon {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--fg-dim);
  opacity: 0.5;
}
.colophon a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px solid transparent;
  padding-bottom: 1px;
  transition: border-color .3s, opacity .3s;
}
.colophon a:hover { border-color: var(--fg-dim); opacity: 1; }
</style>
</head>
<body>

<div class="page">
  <div class="stamp">City Llama · Brooklyn, New York</div>

  <div class="wordmark">City <em>Llama.</em></div>

  <div class="identity">
    <div class="name">Alex Argiles</div>
    <div class="role">Film Producer · Founder</div>
  </div>

  <div class="tagline">
    <em>Film-quality production.</em><br>
    AI-powered strategy.
  </div>

  <div class="cta">
    <div>
      <div class="cta-label">Write us</div>
      <a class="email" href="mailto:alex@cityllamamarketing.com">alex@cityllamamarketing.com</a>
    </div>
    <div class="colophon">MMXXVI · <a href="https://cityllamamarketing.com">cityllamamarketing.com</a></div>
  </div>
</div>

</body>
</html>
